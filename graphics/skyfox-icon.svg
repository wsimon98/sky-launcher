<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Sky Launcher: flat tribal red fox head, transparent background -->
  <!-- ears (outer, dark red) -->
  <polygon points="30,12 80,36 50,88" fill="#B3301C"/>
  <polygon points="162,12 112,36 142,88" fill="#B3301C"/>
  <!-- ears (inner notch, near-black) -->
  <polygon points="42,30 68,42 52,70" fill="#26120D"/>
  <polygon points="150,30 124,42 140,70" fill="#26120D"/>
  <!-- head: angular mask tapering to the chin -->
  <polygon points="38,52 96,30 154,52 148,100 96,172 44,100" fill="#D9442B"/>
  <!-- brow facet (slightly darker, gives the tribal split) -->
  <polygon points="38,52 96,30 154,52 96,72" fill="#C73A22"/>
  <!-- cheek facets (cream, narrow side wedges) -->
  <polygon points="44,100 74,106 96,172" fill="#F6E7D7"/>
  <polygon points="148,100 118,106 96,172" fill="#F6E7D7"/>
  <!-- muzzle facet between cheeks -->
  <polygon points="74,106 118,106 96,172" fill="#E8543A"/>
  <!-- eyes: angular slits -->
  <polygon points="60,84 82,78 78,96" fill="#26120D"/>
  <polygon points="132,84 110,78 114,96" fill="#26120D"/>
  <!-- nose: diamond at the snout tip -->
  <polygon points="96,134 107,146 96,160 85,146" fill="#26120D"/>
</svg>

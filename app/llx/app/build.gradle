apply plugin: 'com.android.application'

android {
    // Namespace stays on the historical R/BuildConfig package to avoid touching
    // every java import. The public application id is Sky Launcher's own.
    namespace 'net.pierrox.lightning_launcher_extreme'
    compileSdk 35

    defaultConfig {
        applicationId "app.skylauncher"
        versionCode 8
        versionName "0.6.1 (LL 14.3 base)"

        minSdk 21
        // Staged low on purpose for classic LLX behavior; see MIGRATION_REPORT.md
        targetSdkVersion 28

        buildConfigField "boolean", "IS_BETA", "false" //  change in core too
        buildConfigField "boolean", "HAS_UEC", "false"
        buildConfigField "boolean", "IS_TRIAL", "false"

        manifestPlaceholders += [
                app_name          : "LLAppSky",
                provider_authority: "net.pierrox.lightning_launcher"
        ]
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Sky ships the full (eXtreme) feature set; its res dir carries
            // layouts/strings referenced by main code. Java from src/extreme
            // (billing/licensing) is deliberately NOT included.
            res.srcDirs += 'src/extreme/res'
            java {
                // Live wallpaper service depends on the removed eXtreme
                // billing classes (LLAppExtreme/LWPSettings); excluded until
                // LWP is re-wired without billing. See BUILD_ERRORS.md.
                exclude 'net/pierrox/lightning_launcher/util/LightningLWPService.java'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'proguard.cfg'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    api project(':core')
}
